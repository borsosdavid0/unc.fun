<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Test</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      display: flex;
      gap: 24px;
      align-items: stretch;
      width: min(1000px, 92vw);
    }

    .left-panel {
      flex: 1;
    }

    .best {
      margin-bottom: 14px;
      padding: 12px 16px;
      border-radius: 14px;
      background: #121833;
      color: #cbd5ff;
      font-size: 1rem;
      box-shadow: 0 0 20px rgba(0,0,0,0.25);
      max-width: 560px;
    }

    #gameBox {
      width: 100%;
      max-width: 560px;
      height: 340px;
      background: #1a2140;
      border-radius: 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
      user-select: none;
      box-shadow: 0 0 30px rgba(0,0,0,0.4);
      text-align: center;
      padding: 20px;
    }

    #gameBox:hover {
      transform: translateY(-2px);
    }

    #text {
      font-size: 1.6rem;
      font-weight: bold;
    }

    .leaderboard {
      width: 280px;
      background: #121833;
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 0 20px rgba(0,0,0,0.35);
      overflow: hidden;
    }

    .leaderboard h3 {
      margin: 0 0 14px;
      text-align: center;
    }

    .leaderboard-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 340px;
      overflow-y: auto;
    }

    .entry {
      background: #1f284f;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .entry span:first-child {
      color: #dbe4ff;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry span:last-child {
      color: #7dd3fc;
      font-weight: 700;
      white-space: nowrap;
    }

    .green { background: #22c55e !important; }
    .red { background: #ef4444 !important; }
    .blue { background: #3b82f6 !important; }

    #backBtn {
      position: absolute;
      top: 20px;
      left: 20px;
      padding: 10px 14px;
      border-radius: 10px;
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #nameModal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: none;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-box {
      background: #121833;
      padding: 22px;
      border-radius: 18px;
      width: min(400px, 92vw);
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    }

    .modal-box h4 {
      margin-top: 0;
      margin-bottom: 12px;
    }

    .modal-box input {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid #2c3765;
      background: #0b1020;
      color: white;
      margin-bottom: 12px;
      box-sizing: border-box;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
    }

    .modal-actions button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .save-btn {
      background: #7c3aed;
      color: white;
    }

    .cancel-btn {
      background: #243055;
      color: white;
    }

    @media (max-width: 850px) {
      .container {
        flex-direction: column;
      }

      .leaderboard {
        width: 100%;
      }

      #gameBox,
      .best {
        max-width: 100%;
      }
    }
  </style>
</head>
<body>
  <button id="backBtn" onclick="location.href='../index.html'">← Back</button>

  <div class="container">
    <div class="left-panel">
      <div class="best" id="personalBest">🏅 Personal Best: --</div>
      <div id="gameBox" class="blue">
        <div id="text">Click to start</div>
      </div>
    </div>

    <aside class="leaderboard">
      <h3>🌍 Global Leaderboard</h3>
      <div class="leaderboard-list" id="leaderboardList">
        <div class="entry"><span>Loading...</span><span>...</span></div>
      </div>
    </aside>
  </div>

  <div id="nameModal">
    <div class="modal-box">
      <h4>Submit score</h4>
      <input id="nicknameInput" type="text" maxlength="16" placeholder="Enter nickname" />
      <div class="modal-actions">
        <button class="save-btn" id="saveScoreBtn">Save Score</button>
        <button class="cancel-btn" id="cancelScoreBtn">Skip</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase.js"></script>
  <script src="reaction-test.js"></script>
</body>
</html>
