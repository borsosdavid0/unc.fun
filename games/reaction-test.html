<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reaction Test</title>
  <style>
    :root {
      --bg: #070b14;
      --bg2: #10172b;
      --panel: rgba(18, 24, 51, 0.88);
      --panel2: rgba(25, 34, 68, 0.92);
      --text: #eef2ff;
      --muted: #9aa6c7;
      --accent: #7c5cff;
      --accent2: #1fd1ff;
      --green: #22c55e;
      --red: #ef4444;
      --blue: #3b82f6;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(124,92,255,0.20), transparent 30%),
        radial-gradient(circle at bottom right, rgba(31,209,255,0.18), transparent 30%),
        linear-gradient(180deg, #060914, #0b1020 45%, #060914);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 32px 18px;
    }

    .page {
      width: min(1220px, 100%);
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .back-btn,
    .small-btn {
      border: none;
      color: white;
      cursor: pointer;
      border-radius: 12px;
      padding: 10px 14px;
      background: rgba(255,255,255,0.08);
      transition: 0.2s ease;
      font-family: inherit;
      font-weight: 600;
    }

    .back-btn:hover,
    .small-btn:hover {
      transform: translateY(-1px);
      background: rgba(255,255,255,0.12);
    }

    .topbar-right {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .username-chip {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      padding: 10px 14px;
      border-radius: 12px;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 600;
    }

    .layout {
      display: grid;
      grid-template-columns: 1.4fr 1fr;
      gap: 20px;
    }

    .left-panel,
    .right-panel {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }

    .left-panel {
      padding: 20px;
    }

    .right-panel {
      padding: 18px;
      display: grid;
      gap: 18px;
      align-content: start;
    }

    .best {
      margin-bottom: 14px;
      padding: 14px 16px;
      border-radius: 16px;
      background: var(--panel);
      color: #dbe4ff;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.04);
    }

    #gameBox {
      width: 100%;
      min-height: 360px;
      border-radius: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      user-select: none;
      padding: 20px;
      text-align: center;
      background:
        linear-gradient(135deg, rgba(124,92,255,0.16), rgba(31,209,255,0.10)),
        var(--panel2);
      border: 1px solid rgba(255,255,255,0.08);
      transition: transform 0.18s ease, background 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    }

    #gameBox:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.30);
    }

    #text {
      font-size: clamp(1.4rem, 3vw, 2.2rem);
      font-weight: 800;
      line-height: 1.2;
    }

    .controls {
      display: grid;
      gap: 12px;
      margin-top: 14px;
    }

    .ranked-btn {
      border: none;
      border-radius: 16px;
      padding: 16px;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      color: white;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      box-shadow: 0 12px 30px rgba(124,92,255,0.25);
      transition: transform 0.18s ease, opacity 0.2s ease;
      font-family: inherit;
    }

    .ranked-btn:hover {
      transform: translateY(-2px);
      opacity: 0.96;
    }

    .muted {
      color: var(--muted);
      font-size: 0.95rem;
    }

    .panel {
      background: var(--panel);
      border-radius: 18px;
      padding: 16px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .panel h3 {
      margin: 0 0 12px;
      font-size: 1rem;
    }

    .leaderboard-list,
    .status-list {
      display: grid;
      gap: 10px;
    }

    .entry,
    .status-row {
      background: #1f284f;
      border-radius: 12px;
      padding: 10px 12px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }

    .status-row strong {
      color: white;
    }

    .entry span:first-child {
      color: #dbe4ff;
      font-weight: 700;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .entry span:last-child {
      color: #7dd3fc;
      font-weight: 800;
      white-space: nowrap;
    }

    .green {
      background: var(--green) !important;
      box-shadow: 0 0 30px rgba(34, 197, 94, 0.45);
    }

    .red {
      background: var(--red) !important;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.35);
    }

    .blue {
      background: var(--blue) !important;
    }

    /* Loading overlay while auth initialises */
    #authLoadingOverlay {
      position: fixed;
      inset: 0;
      background: #070b14;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 999;
      font-size: 1.1rem;
      color: #9aa6c7;
      transition: opacity 0.3s;
    }

    @media (max-width: 980px) {
      .layout {
        grid-template-columns: 1fr;
      }

      #gameBox {
        min-height: 300px;
      }
    }
  </style>
</head>
<body>
  <!-- Auth loading overlay -->
  <div id="authLoadingOverlay">Checking login…</div>

  <div class="page">
    <div class="topbar">
      <button class="back-btn" onclick="location.href='../index.html'">← Back</button>

      <div class="topbar-right">
        <div class="username-chip" id="usernameChip">👤 --</div>
        <button class="small-btn" id="logoutBtn">Logout</button>
      </div>
    </div>

    <div class="layout">
      <section class="left-panel">
        <div class="best" id="personalBest">🏅 Personal Best: --</div>

        <div id="gameBox" class="blue">
          <div id="text">Click to start solo mode</div>
        </div>

        <div class="controls">
          <button class="ranked-btn" id="rankedBtn">⚔️ Play Ranked</button>
          <div class="muted">
            Ranked is 1v1. Both players start with 3 lives. Slower reaction loses 1 life.
          </div>
        </div>
      </section>

      <aside class="right-panel">
        <div class="panel">
          <h3>🌍 Solo Leaderboard</h3>
          <div class="leaderboard-list" id="leaderboardList">
            <div class="entry"><span>Loading...</span><span>...</span></div>
          </div>
        </div>

        <div class="panel">
          <h3>🎯 Ranked Status</h3>
          <div class="status-list">
            <div class="status-row"><span>Status</span><strong id="rankedStatus">Idle</strong></div>
            <div class="status-row"><span>Round</span><strong id="roundNumber">--</strong></div>
            <div class="status-row"><span>You</span><strong id="youLives">❤️❤️❤️</strong></div>
            <div class="status-row"><span>Opponent</span><strong id="opponentName">--</strong></div>
            <div class="status-row"><span>Opponent Lives</span><strong id="opponentLives">❤️❤️❤️</strong></div>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../config/supabase.js"></script>
  <script src="reaction-test.js"></script>
</body>
</html>
